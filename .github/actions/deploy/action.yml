name: Build, attest and deploy
description: >-
  Builds the site, records evidence (SBOM, optional build provenance and signature) and deploys the PRE-BUILT output to
  Vercel. A composite action rather than a reusable workflow because secrets of a GitHub Environment are only available
  to a job that declares that environment, and a job that calls a reusable workflow cannot. The calling job
  (deploy-staging.yml, release.yml) declares the environment, checks out the repository and passes the credentials in.

inputs:
  environment:
    description: GitHub Environment being deployed to (staging or production)
    required: true
  vercel-environment:
    description: Vercel environment (preview or production)
    required: true
  label:
    description: Release label used in artifact names (commit SHA or version tag)
    required: true
  org-id:
    description: Vercel team id (VERCEL_ORG_ID, not secret)
    required: true
  project-id:
    description: Vercel project id (VERCEL_PROJECT_ID, not secret)
    required: true
  vercel-token:
    description: Scoped Vercel token for this environment. Only the deploy step reads it.
    required: true
  bypass-secret:
    description: Optional Vercel automation bypass secret for the smoke test
    required: false
    default: ""
  staging-alias:
    description: Optional stable hostname for staging
    required: false
    default: ""
  attestations:
    description: "'false' skips GitHub artifact attestations (not available for user-owned private repositories)"
    required: false
    default: "true"
  cosign:
    description: "'true' opts in to keyless Sigstore signing (public transparency log; off by default)"
    required: false
    default: "false"
  api-mode:
    description: >-
      'http' builds the production app, which works on live company data through /api (NEXT_PUBLIC_API_MODE=http,
      NEXT_PUBLIC_API_BASE_URL=/api, both public). Empty or 'mock' builds the demonstration. Anything else fails the build.
    required: false
    default: ""

outputs:
  url:
    description: Deployment URL
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
        VERCEL_ENV: ${{ inputs.vercel-environment }}
        LABEL: ${{ inputs.label }}
        API_MODE: ${{ inputs.api-mode }}
        VERCEL_ORG_ID: ${{ inputs.org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
      run: |
        [[ $TARGET_ENV =~ ^(staging|production)$ ]]   || { echo "invalid environment" >&2; exit 1; }
        [[ $VERCEL_ENV =~ ^(preview|production)$ ]]   || { echo "invalid vercel environment" >&2; exit 1; }
        [[ $LABEL =~ ^[A-Za-z0-9._-]{1,64}$ ]]        || { echo "invalid label" >&2; exit 1; }
        [[ -z $API_MODE || $API_MODE =~ ^(mock|http)$ ]] || { echo "invalid api-mode: use mock or http (environment variable API_MODE)" >&2; exit 1; }
        echo "### Build mode: ${API_MODE:-mock} ($([[ $API_MODE == http ]] && echo 'production app on /api' || echo 'demonstration'))" >> "$GITHUB_STEP_SUMMARY"
        [[ -n $VERCEL_ORG_ID && -n $VERCEL_PROJECT_ID ]] || { echo "VERCEL_ORG_ID / VERCEL_PROJECT_ID are not set for environment $TARGET_ENV" >&2; exit 1; }

    # Fails in seconds, with a clear message, instead of after a full build. It prints whether each credential is
    # present (true/false) and NEVER a value: only the boolean result of the comparison reaches this step.
    - name: Check deploy credentials are present
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
        TOKEN_SET: ${{ inputs.vercel-token != '' }}
        BYPASS_SET: ${{ inputs.bypass-secret != '' }}
        ORG_SET: ${{ inputs.org-id != '' }}
        PROJECT_SET: ${{ inputs.project-id != '' }}
      run: |
        {
          echo "### Deploy credentials for environment \`$TARGET_ENV\` (presence only)"
          echo "- VERCEL_TOKEN (secret): $TOKEN_SET"
          echo "- VERCEL_AUTOMATION_BYPASS_SECRET (secret, optional): $BYPASS_SET"
          echo "- VERCEL_ORG_ID (variable): $ORG_SET"
          echo "- VERCEL_PROJECT_ID (variable): $PROJECT_SET"
        } | tee -a "$GITHUB_STEP_SUMMARY"
        if [[ $TOKEN_SET != true ]]; then
          echo "::error title=VERCEL_TOKEN is not available::The deploy job for environment '$TARGET_ENV' received no VERCEL_TOKEN. Add it as an ENVIRONMENT secret named exactly VERCEL_TOKEN under Settings > Environments > $TARGET_ENV (docs/security/PIPELINE.md, Vercel setup)."
          exit 1
        fi

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    # The CLI lives in its own lockfile-pinned install, apart from the application's dependencies.
    - name: Install deploy tooling (lockfile, no install scripts)
      shell: bash
      working-directory: .github/vercel-cli
      run: npm ci --ignore-scripts --no-audit --no-fund

    # The build needs NO credentials. Instead of `vercel pull` (which needs the token), the project link is written
    # from the environment's non-secret variables, with settings that mirror front-end/vercel.json. The Vercel CLI
    # and its builders therefore run without any secret in their environment; the token appears only in the final
    # deploy step. Public build-time settings (NEXT_PUBLIC_*) are passed explicitly as env: on the Build step.
    - name: Write project link (no token)
      shell: bash
      env:
        VERCEL_ORG_ID: ${{ inputs.org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
      run: |
        mkdir -p .vercel
        node -e '
          const fs = require("fs");
          fs.writeFileSync(".vercel/project.json", JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID,
            settings: { framework: "nextjs", rootDirectory: "front-end", sourceFilesOutsideRootDirectory: true, nodeVersion: "22.x",
              installCommand: "npm ci --ignore-scripts --no-audit --no-fund", buildCommand: "npm run build", devCommand: null, outputDirectory: null },
          }, null, 2));'

    - name: Build (no secrets in the environment)
      shell: bash
      env:
        VERCEL_ENV: ${{ inputs.vercel-environment }}
        VERCEL_ORG_ID: ${{ inputs.org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
        VERCEL_BIN: ${{ github.workspace }}/.github/vercel-cli/node_modules/.bin/vercel
        # Public, baked into the browser code (validated above). Not secrets.
        NEXT_PUBLIC_API_MODE: ${{ inputs.api-mode == 'http' && 'http' || 'mock' }}
        NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api-mode == 'http' && '/api' || '' }}
      run: |
        args=()
        [[ $VERCEL_ENV == production ]] && args+=(--prod)
        "$VERCEL_BIN" build "${args[@]}"

    - name: Check what will be shipped
      shell: bash
      run: node .github/scripts/check-shipped-artifact.mjs .vercel/output

    - name: Package build output (deterministic archive)
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
      run: |
        ARTIFACT="selvara-frontend-${LABEL}.tar.gz"
        tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - -C .vercel output | gzip -n > "$ARTIFACT"
        sha256sum "$ARTIFACT" | tee "$ARTIFACT.sha256"
        echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

    - name: Generate SBOM (CycloneDX)
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: front-end
        format: cyclonedx-json
        output-file: sbom.cdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Attest build provenance (SLSA)
      if: inputs.attestations != 'false'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ env.ARTIFACT }}

    - name: Attest SBOM
      if: inputs.attestations != 'false'
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-path: ${{ env.ARTIFACT }}
        sbom-path: sbom.cdx.json

    # Keyless signing records the signer identity and repository name in the PUBLIC Sigstore transparency log, which is
    # not acceptable by default for a private repository. It is therefore OFF unless the input is exactly 'true'.
    - name: Install cosign
      if: inputs.cosign == 'true'
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Sign build archive (cosign, keyless)
      if: inputs.cosign == 'true'
      shell: bash
      run: cosign sign-blob --yes --bundle "$ARTIFACT.cosign.bundle" "$ARTIFACT"

    # Deploy exactly what was attested: discard the build directory and extract the verified archive.
    - name: Deploy the attested archive
      id: deploy
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        STAGING_ALIAS: ${{ inputs.staging-alias }}
        TARGET_ENV: ${{ inputs.environment }}
        VERCEL_ENV: ${{ inputs.vercel-environment }}
        LABEL: ${{ inputs.label }}
        VERCEL_ORG_ID: ${{ inputs.org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
        VERCEL_BIN: ${{ github.workspace }}/.github/vercel-cli/node_modules/.bin/vercel
      run: |
        sha256sum -c "$ARTIFACT.sha256"
        rm -rf .vercel/output
        tar -xzf "$ARTIFACT" -C .vercel
        args=(--prebuilt --meta "githubCommitSha=$GITHUB_SHA" --meta "githubRunId=$GITHUB_RUN_ID")
        [[ $VERCEL_ENV == production ]] && args+=(--prod)
        url=$("$VERCEL_BIN" deploy "${args[@]}")
        [[ $url =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "unexpected deploy output" >&2; exit 1; }
        if [[ $TARGET_ENV == staging && -n ${STAGING_ALIAS:-} ]]; then
          [[ $STAGING_ALIAS =~ ^[A-Za-z0-9.-]+$ ]] || { echo "invalid STAGING_ALIAS" >&2; exit 1; }
          "$VERCEL_BIN" alias set "$url" "$STAGING_ALIAS"
          url="https://$STAGING_ALIAS"
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "Deployed $LABEL to $TARGET_ENV: $url" >> "$GITHUB_STEP_SUMMARY"

    - name: Smoke test (security headers on the live deployment)
      shell: bash
      env:
        DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ inputs.bypass-secret }}
      run: .github/scripts/smoke-headers.sh "$DEPLOY_URL"

    - name: Upload release evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-evidence-${{ inputs.label }}
        path: |
          selvara-frontend-*.tar.gz
          selvara-frontend-*.tar.gz.sha256
          selvara-frontend-*.tar.gz.cosign.bundle
          sbom.cdx.json
        retention-days: 90
        if-no-files-found: ignore
