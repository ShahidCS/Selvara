name: Bug report
description: Something in the portal does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic data only. Never paste real personal data, credentials or tokens. Security vulnerabilities go through SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the route (for example /ws/risk) and the role you were signed in as.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and version
