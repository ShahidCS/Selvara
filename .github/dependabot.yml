# Dependabot keeps three dependency surfaces current: the application, the isolated deploy tooling, and the
# pinned GitHub Actions (SHA pins are updated together with their version comment).
#
# cooldown delays brand-new releases a few days: most malicious or broken package versions are caught and
# pulled within that window (supply-chain defence). Security updates are not delayed by it.
# Major version bumps are never grouped, so each gets its own pull request, its own CI run and its own review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /front-end
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major bumps that need a planned migration, not a dependency update. Each is tracked as its own task:
    #  - typescript 7: removes `baseUrl` (tsconfig must change) and typescript-eslint does not support it yet
    #  - tailwindcss 4: new PostCSS plugin package and CSS-based config replace tailwind.config.js
    #  - @types/node 26: describes Node 26 APIs while CI and the toolchain run Node 22; bump with the Node version
    # Minor and patch updates of these packages still arrive normally. Remove an entry when its migration is done.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /.github/vercel-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The local composite action that builds and deploys (its SHA-pinned actions are updated here, like the workflows').
  - package-ecosystem: github-actions
    directory: /.github/actions/deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
