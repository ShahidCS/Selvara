name: Deploy (reusable)

# Builds the site in CI, records evidence (SBOM, build provenance, signature) and deploys the PRE-BUILT output to
# Vercel. Vercel's own Git integration is disabled (front-end/vercel.json), so this workflow is the only path
# to a deployment, and it is only reachable through deploy-staging.yml and release.yml, which run CI and the
# security gates first.
#
# Required in the GitHub Environment (Settings > Environments > <environment>):
#   secret   VERCEL_TOKEN                      scoped deploy token for this environment only
#   variable VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   optional secret VERCEL_AUTOMATION_BYPASS_SECRET (lets the smoke test reach a protected preview)
#   optional variable STAGING_ALIAS (stable staging domain), ATTESTATIONS_ENABLED=false (skip provenance attestations),
#   COSIGN_ENABLED=true (opt in to keyless Sigstore signing; OFF by default, see the note on the signing step)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to (staging or production)
        type: string
        required: true
      vercel-environment:
        description: Vercel environment to pull settings from (preview or production)
        type: string
        required: true
      label:
        description: Release label used in artifact names (commit SHA or version tag)
        type: string
        required: true
    outputs:
      url:
        description: Deployment URL
        value: ${{ jobs.deploy.outputs.url }}

permissions: {}

jobs:
  deploy:
    name: Build, attest and deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # keyless signing and build provenance
      attestations: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      VERCEL_ENV: ${{ inputs.vercel-environment }}
      LABEL: ${{ inputs.label }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_BIN: ${{ github.workspace }}/.github/vercel-cli/node_modules/.bin/vercel
      # NOTE: the Vercel token is NOT set here. It is passed only to the steps that need it, so third-party
      # actions in this job (SBOM, attestation, signing) never see it.
    steps:
      - name: Validate inputs
        run: |
          [[ $TARGET_ENV =~ ^(staging|production)$ ]]   || { echo "invalid environment" >&2; exit 1; }
          [[ $VERCEL_ENV =~ ^(preview|production)$ ]]   || { echo "invalid vercel environment" >&2; exit 1; }
          [[ $LABEL =~ ^[A-Za-z0-9._-]{1,64}$ ]]        || { echo "invalid label" >&2; exit 1; }
          [[ -n $VERCEL_ORG_ID && -n $VERCEL_PROJECT_ID ]] || { echo "VERCEL_ORG_ID / VERCEL_PROJECT_ID are not set for environment $TARGET_ENV" >&2; exit 1; }

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The CLI lives in its own lockfile-pinned install, apart from the application's dependencies.
      - name: Install deploy tooling (lockfile, no install scripts)
        working-directory: .github/vercel-cli
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: '"$VERCEL_BIN" pull --yes --environment="$VERCEL_ENV"'

      - name: Build
        run: |
          args=()
          [[ $VERCEL_ENV == production ]] && args+=(--prod)
          "$VERCEL_BIN" build "${args[@]}"

      - name: Package build output (deterministic archive)
        run: |
          ARTIFACT="selvara-frontend-${LABEL}.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - -C .vercel output | gzip -n > "$ARTIFACT"
          sha256sum "$ARTIFACT" | tee "$ARTIFACT.sha256"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: front-end
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance (SLSA)
        if: vars.ATTESTATIONS_ENABLED != 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACT }}

      - name: Attest SBOM
        if: vars.ATTESTATIONS_ENABLED != 'false'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ARTIFACT }}
          sbom-path: sbom.cdx.json

      # Keyless signing records the signer identity and repository name in the PUBLIC Sigstore transparency log, which is
      # not acceptable by default for a private repository. It is therefore OFF unless the variable COSIGN_ENABLED is
      # exactly 'true'. (GitHub artifact attestations above are stored privately by GitHub and are not affected.)
      - name: Install cosign
        if: vars.COSIGN_ENABLED == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign build archive (cosign, keyless)
        if: vars.COSIGN_ENABLED == 'true'
        run: cosign sign-blob --yes --bundle "$ARTIFACT.cosign.bundle" "$ARTIFACT"

      # Deploy exactly what was attested: discard the build directory and extract the verified archive.
      - name: Deploy the attested archive
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_ALIAS: ${{ vars.STAGING_ALIAS }}
        run: |
          sha256sum -c "$ARTIFACT.sha256"
          rm -rf .vercel/output
          tar -xzf "$ARTIFACT" -C .vercel
          args=(--prebuilt --meta "githubCommitSha=$GITHUB_SHA" --meta "githubRunId=$GITHUB_RUN_ID")
          [[ $VERCEL_ENV == production ]] && args+=(--prod)
          url=$("$VERCEL_BIN" deploy "${args[@]}")
          [[ $url =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "unexpected deploy output" >&2; exit 1; }
          if [[ $TARGET_ENV == staging && -n ${STAGING_ALIAS:-} ]]; then
            [[ $STAGING_ALIAS =~ ^[A-Za-z0-9.-]+$ ]] || { echo "invalid STAGING_ALIAS" >&2; exit 1; }
            "$VERCEL_BIN" alias set "$url" "$STAGING_ALIAS"
            url="https://$STAGING_ALIAS"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $LABEL to $TARGET_ENV: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (security headers on the live deployment)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: .github/scripts/smoke-headers.sh "$DEPLOY_URL"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ inputs.label }}
          path: |
            selvara-frontend-*.tar.gz
            selvara-frontend-*.tar.gz.sha256
            selvara-frontend-*.tar.gz.cosign.bundle
            sbom.cdx.json
          retention-days: 90
          if-no-files-found: ignore
