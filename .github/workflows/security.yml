name: Security

# Security gates. Policy: HIGH and CRITICAL findings block (the job fails); MEDIUM and below are
# reported in the run summary and as downloadable reports. This repository is private WITHOUT GitHub Advanced
# Security, so nothing here depends on the Security tab: gates read the scanners' own output. If Advanced Security
# is ever available, set the repository variable CODE_SCANNING_ENABLED=true to also upload results to the Security tab. Runs on pull requests, weekly (new advisories appear
# without code changes), and is reused (workflow_call) by the staging and release pipelines.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC, default branch only

permissions: {}

concurrency:
  # distinct suffix per workflow: when called from deploy/release, github.workflow is the CALLER's name, so two reusable
  # workflows would otherwise share one group and cancel each other
  group: ${{ github.workflow }}-security-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # The pipeline's own supply-chain policy: pinned actions, least-privilege permissions, no
  # pull_request_target, no script injection. Needs no dependencies and runs first.
  # ---------------------------------------------------------------------------------------------
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enforce workflow policy
        run: node .github/scripts/check-workflows.mjs

  # ---------------------------------------------------------------------------------------------
  # Static analysis (SAST). CodeQL results are written to a SARIF file and gated by check-sarif.mjs (High and
  # Critical fail the job). The SARIF is kept as a downloadable artefact. Upload to the Security tab happens only
  # when CODE_SCANNING_ENABLED=true (needs Advanced Security on a private repository).
  # ---------------------------------------------------------------------------------------------
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # used only when CODE_SCANNING_ENABLED=true
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
          output: codeql-sarif
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}
          upload-database: false
      - name: Gate on High and Critical findings
        run: node .github/scripts/check-sarif.mjs codeql-sarif
      - name: Keep the SARIF report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-sarif
          retention-days: 30
          if-no-files-found: ignore

    # ---------------------------------------------------------------------------------------------
  # Secret scanning over the full history. (GitHub's native secret scanning with push protection
  # is the first line of defence and is enabled in repository settings; this is the second.)
  # A personal-account repository needs no Gitleaks licence. If the repo moves to an organisation,
  # add the GITLEAKS_LICENSE secret.
  # ---------------------------------------------------------------------------------------------
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------------------------------------
  # Known High/Critical advisories in the dependencies that ship (runtime scope), read straight from the lockfile
  # with npm audit. GitHub's own Dependency review needs the dependency graph and Advanced Security, which a private
  # repository on this plan does not have. Copyleft licences are blocked separately by "Licence policy".
  # ---------------------------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Audit runtime dependencies (High and above block)
        working-directory: front-end
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: Report the full tree (development tools included; informational)
        working-directory: front-end
        continue-on-error: true
        run: npm audit --package-lock-only

  # ---------------------------------------------------------------------------------------------
  # Licence policy over the whole installed tree (see .github/license-policy.json).
  # ---------------------------------------------------------------------------------------------
  licences:
    name: Licence policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enforce licence policy
        run: node .github/scripts/check-licenses.mjs front-end/package-lock.json .github/license-policy.json

  # ---------------------------------------------------------------------------------------------
  # OSV: a second vulnerability database (informational). osv-scanner cannot filter by severity,
  # so blocking is done by npm audit (CI and Dependency review) and Trivy; the OSV report is kept as an artefact
  # for triage.
  # ---------------------------------------------------------------------------------------------
  osv:
    name: OSV scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # used only when CODE_SCANNING_ENABLED=true
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV scan (informational, it exits non-zero when it finds anything)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=front-end/package-lock.json
            --lockfile=.github/vercel-cli/package-lock.json
            --format=sarif
            --output-file=osv-results.sarif
      - name: Keep the OSV report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-results
          path: osv-results.sarif
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload OSV results to the Security tab
        if: always() && vars.CODE_SCANNING_ENABLED == 'true' && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  # ---------------------------------------------------------------------------------------------
  # Trivy filesystem scan: vulnerabilities in lockfiles, misconfiguration in workflows/config, and
  # secrets. Blocks on fixable HIGH/CRITICAL findings.
  # ---------------------------------------------------------------------------------------------
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy (vulnerabilities, misconfiguration, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # .github/vercel-cli is the isolated deploy-tooling install. Its transitive findings are accepted with
          # controls (see docs/security/PIPELINE.md, "Accepted risks") and tracked by the informational OSV scan instead.
          skip-dirs: .github/vercel-cli
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # ---------------------------------------------------------------------------------------------
  # Deploy tooling (.github/vercel-cli): it must install from its lockfile and start, no CRITICAL advisory is ever
  # tolerated, and a HIGH advisory is tolerated only if it is listed, with an owner, a reason and a review date, in
  # .github/vercel-cli/audit-baseline.json. A new HIGH advisory fails here.
  # ---------------------------------------------------------------------------------------------
  tooling:
    name: Deploy tooling audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install tooling (lockfile, no install scripts)
        working-directory: .github/vercel-cli
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tooling starts
        working-directory: .github/vercel-cli
        run: ./node_modules/.bin/vercel --version
      - name: Audit against the accepted baseline
        working-directory: .github/vercel-cli
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/tooling-audit.json" || true
          node "$GITHUB_WORKSPACE/.github/scripts/check-tooling-audit.mjs" "$RUNNER_TEMP/tooling-audit.json" audit-baseline.json

  # ---------------------------------------------------------------------------------------------
  # DAST: ZAP baseline (passive) scan of the production build served on the runner. Blocks on any
  # HIGH alert; MEDIUM and below are reported. The same scan is not repeated against staging.
  # ---------------------------------------------------------------------------------------------
  dast:
    name: ZAP baseline (DAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Install dependencies (no install scripts)
        working-directory: front-end
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        working-directory: front-end
        run: npm run build
      - name: Start the production build
        working-directory: front-end
        run: |
          nohup npx next start -p 3100 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3100/ws/overview && exit 0
            sleep 2
          done
          echo "App did not start" >&2; cat "$RUNNER_TEMP/next.log" >&2; exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3100
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report
      - name: Gate on HIGH alerts
        run: node .github/scripts/zap-gate.mjs report_json.json
